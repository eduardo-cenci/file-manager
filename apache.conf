<VirtualHost *:80>
    ServerAdmin webmaster@localhost

    DocumentRoot /app/public

    <Directory /app/public>
        Options -Indexes
        AllowOverride None
        Require all granted

        RewriteEngine On

        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d

        RewriteRule ^ index.php [QSA,L]
    </Directory>

    ErrorLog /app/storage/logs/apache/error.log
    CustomLog /app/storage/logs/apache/access.log combined
</VirtualHost>